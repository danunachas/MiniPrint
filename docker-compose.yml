# docker compose up -d   ->  http://127.0.0.1:8765/
services:
  miniprint:
    image: ghcr.io/danunachas/miniprint:latest     # or build it yourself:  docker compose up -d --build
    build: .
    ports:
      # only this computer can reach MiniPrint. It has no password: write "8765:8765" to open it to your
      # network only if you trust everyone on that network.
      - "127.0.0.1:8765:8765"
    volumes:
      - miniprint-data:/data                  # your settings profiles
    restart: unless-stopped

volumes:
  miniprint-data:
